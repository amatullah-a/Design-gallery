<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Gallery</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #f4f7ff; min-height: 100vh; }
    main { width: min(1060px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
    h1 { font-size: clamp(2.2rem, 7vw, 4.8rem); line-height: .95; margin: 0 0 18px; }
    .intro { color: #aeb9d3; font-size: 1.1rem; margin: 0 0 42px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .card { color: inherit; text-decoration: none; padding: 24px; min-height: 110px; border: 1px solid #293451;
      border-radius: 16px; background: #121a2e; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform .16s ease, border-color .16s ease; }
    .card:hover { transform: translateY(-3px); border-color: #7c9cff; }
    .card span { font-size: 1.2rem; font-weight: 700; } .card small { color: #8e9ab5; }
    .empty { color: #8e9ab5; } footer { margin-top: 46px; color: #6f7b96; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Design Gallery</h1>
    <p class="intro">A collection of visual design projects.</p>
    <section class="grid" aria-label="Design projects">
      <a class="card" href="designs/cc/"><span>Cc</span><small>cc</small></a>
      <a class="card" href="designs/login%20page/"><span>Login Page</span><small>login page</small></a>
      <a class="card" href="designs/placedesk/"><span>Placedesk</span><small>placedesk</small></a>
      <a class="card" href="designs/Shop/"><span>Shop</span><small>Shop</small></a>
      <a class="card" href="designs/shop%20draft/"><span>Shop Draft</span><small>shop draft</small></a>
    </section>
    <footer>Updated by Design Sync</footer>
  </main>
</body>
</html>
