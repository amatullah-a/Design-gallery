    const TODAY_ISO_STRING = formatDateToISO(new Date());

    // --- UTILITY FUNCTIONS ---
    function formatDateToISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatFullDate(dateString) {
      if (!dateString) return '';
      const [year, month, day] = dateString.split('-').map(Number);
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString('en-IE', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric',
      });
    }

    function isDateInRange(targetDateStr, startDateStr, endDateStr) {
      if (!endDateStr) {
        return targetDateStr === startDateStr;
      }
      return targetDateStr >= startDateStr && targetDateStr <= endDateStr;
    }

    function getMonthDaysGrid(currentDate, events) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const getDayIndex = (d) => (d.getDay() + 6) % 7; // Mon = 0
      const startDayOffset = getDayIndex(firstDay);
      const totalDaysCurrentMonth = lastDay.getDate();
      const cells = [];

      // Prev month trailing days
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayOffset - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const d = new Date(year, month - 1, dayNum);
        const dateStr = formatDateToISO(d);
        const matchedEvents = events.filter((ev) => isDateInRange(dateStr, ev.startDate, ev.endDate));
        cells.push({
          date: d,
          dateString: dateStr,
          dayNumber: dayNum,
          isCurrentMonth: false,
          isToday: dateStr === TODAY_ISO_STRING,
          isWeekend: d.getDay() === 0 || d.getDay() === 6,
          events: matchedEvents,
        });
      }

      // Current month days
      for (let i = 1; i <= totalDaysCurrentMonth; i++) {
        const d = new Date(year, month, i);
        const dateStr = formatDateToISO(d);
        const matchedEvents = events.filter((ev) => isDateInRange(dateStr, ev.startDate, ev.endDate));
        cells.push({
          date: d,
          dateString: dateStr,
          dayNumber: i,
          isCurrentMonth: true,
          isToday: dateStr === TODAY_ISO_STRING,
          isWeekend: d.getDay() === 0 || d.getDay() === 6,
          events: matchedEvents,
        });
      }

      // Next month leading days
      const targetTotal = cells.length + ((7 - (cells.length % 7)) % 7);
      const daysNeeded = (targetTotal < 35 ? 35 : targetTotal) - cells.length;
      for (let i = 1; i <= daysNeeded; i++) {
        const d = new Date(year, month + 1, i);
        const dateStr = formatDateToISO(d);
        const matchedEvents = events.filter((ev) => isDateInRange(dateStr, ev.startDate, ev.endDate));
        cells.push({
          date: d,
          dateString: dateStr,
          dayNumber: i,
          isCurrentMonth: false,
          isToday: dateStr === TODAY_ISO_STRING,
          isWeekend: d.getDay() === 0 || d.getDay() === 6,
          events: matchedEvents,
        });
      }

      return cells;
    }

    function getMonthWeeksGrid(currentDate, events) {
      const allCells = getMonthDaysGrid(currentDate, events);
      const weeks = [];

      for (let i = 0; i < allCells.length; i += 7) {
        const weekDays = allCells.slice(i, i + 7);
        if (weekDays.length < 7) break;
        const weekStartStr = weekDays[0].dateString;
        const weekEndStr = weekDays[6].dateString;

        const multiDaySegments = [];
        const singleEventsByDate = {};
        weekDays.forEach((day) => {
          singleEventsByDate[day.dateString] = [];
        });

        const seenMultiDayIds = new Set();
        events.forEach((ev) => {
          const isMulti = Boolean(ev.endDate && ev.endDate !== ev.startDate);
          const evEnd = ev.endDate || ev.startDate;
          const overlapsWeek = ev.startDate <= weekEndStr && evEnd >= weekStartStr;
          if (!overlapsWeek) return;

          if (isMulti) {
            if (!seenMultiDayIds.has(ev.id)) {
              seenMultiDayIds.add(ev.id);
              let startIdx = 0;
              for (let col = 0; col < 7; col++) {
                if (weekDays[col].dateString >= ev.startDate) {
                  startIdx = col;
                  break;
                }
              }
              if (ev.startDate < weekStartStr) startIdx = 0;

              let endIdx = 6;
              for (let col = 6; col >= 0; col--) {
                if (weekDays[col].dateString <= evEnd) {
                  endIdx = col;
                  break;
                }
              }
              if (evEnd > weekEndStr) endIdx = 6;

              multiDaySegments.push({
                event: ev,
                startIndex: startIdx,
                span: Math.max(1, endIdx - startIdx + 1),
                isStart: ev.startDate >= weekStartStr,
                isEnd: evEnd <= weekEndStr,
              });
            }
          } else {
            if (singleEventsByDate[ev.startDate]) {
              singleEventsByDate[ev.startDate].push(ev);
            }
          }
        });

        weeks.push({
          weekIndex: Math.floor(i / 7),
          days: weekDays,
          multiDaySegments,
          singleEventsByDate,
        });
      }
      return weeks;
    }

    function generateGoogleCalendarUrl(event) {
      const title = encodeURIComponent(event.title);
      const details = encodeURIComponent(
        `${event.description}\n\nTarget Group: ${event.targetYears.join(', ')}\nLocation: ${event.location}\nOrganizer: ${event.organizer || 'Mount Sackville School'}`
      );
      const location = encodeURIComponent(event.location);
      const startFormatted = event.startDate.replace(/-/g, '');
      const endD = new Date(event.endDate || event.startDate);
      endD.setDate(endD.getDate() + 1);
      const nextDay = formatDateToISO(endD).replace(/-/g, '');
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&location=${location}&dates=${startFormatted}/${nextDay}`;
    }

    function downloadICSFile(event) {
      const start = event.startDate.replace(/-/g, '');
      const end = (event.endDate || event.startDate).replace(/-/g, '');
      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Mount Sackville Secondary School//School Calendar//EN',
        'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        `UID:${event.id}-${Date.now()}@mountsackville.ie`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
        `DTSTART;VALUE=DATE:${start}`,
        `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${event.title}`,
        `DESCRIPTION:${event.description.replace(/\n/g, '\\n')}`,
        `LOCATION:${event.location}`,
        'STATUS:CONFIRMED',
        'END:VEVENT',
        'END:VCALENDAR',
      ].join('\r\n');

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${event.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

                >

                  <span className="hidden sm:inline">Categories</span>
                  <span className="sm:hidden">Cat.</span>

                </button>

                {categoriesDropdownOpen && (
                  <div className="absolute right-0 lg:left-1/2 lg:-translate-x-1/2 top-full mt-2 w-72 sm:w-[320px] bg-white rounded-xl border border-slate-200 shadow-xl z-20 flex flex-col max-h-96 animate-fadeIn">
                    <div className="overflow-y-auto py-2">

                        <div className="flex items-center h-5">
                          <input

    // Month View Component
    const MonthView = ({ currentDate, events, onSelectEvent }) => {
      const [expandedDay, setExpandedDay] = useState(null);
      const [expandedEventId, setExpandedEventId] = useState(null);
      const [selectedEmptyDay, setSelectedEmptyDay] = useState(null);
      const weekRows = getMonthWeeksGrid(currentDate, events);

      const WEEKDAYS = [
        { short: 'Mon', full: 'Monday' },
        { short: 'Tue', full: 'Tuesday' },
        { short: 'Wed', full: 'Wednesday' },
        { short: 'Thu', full: 'Thursday' },
        { short: 'Fri', full: 'Friday' },
        { short: 'Sat', full: 'Saturday' },
        { short: 'Sun', full: 'Sunday' },
      ];

      return (
        <div className="w-full bg-white rounded-xl border border-slate-300 shadow-2xs overflow-hidden select-none">
          {/* Weekday Header */}
          <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-[14px] font-semibold text-slate-600">
            {WEEKDAYS.map((day) => {
              const todayDate = new Date(); const todayDayShorts = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; const todayShort = todayDayShorts[todayDate.getDay()]; const isTodayColumn = day.short === todayShort && currentDate.getFullYear() === todayDate.getFullYear() && currentDate.getMonth() === todayDate.getMonth();
              const isWeekend = day.short === 'Sat' || day.short === 'Sun';
              const isSaturday = day.short === 'Sat';
              return (
                <div
                  key={day.short}
                  className={`py-2 px-1 text-center border-r last:border-r-0 border-slate-200/70 transition-colors ${
                    isTodayColumn 
                      ? 'bg-blue-50/80 text-[#08328d] font-bold' 
                      : isWeekend 
                        ? 'bg-slate-50 text-slate-400' 
                        : 'text-slate-700'
                  } ${isSaturday ? 'border-l-2 border-slate-300' : ''}`}
                >
                  <div className="flex items-center justify-center gap-1">
                    <span className="hidden sm:inline">{day.full}</span>
                    <span className="sm:hidden">{day.short}</span>
                    {isTodayColumn && <span className="w-1.5 h-1.5 rounded-full bg-[#08328d] hidden md:inline-block" />}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Calendar Rows */}
          <div className="divide-y divide-slate-200">
            {weekRows.map((week, wIndex) => (
              <div key={`week-${week.weekIndex}`} className="flex flex-col bg-white">
                {/* Day Cells Grid */}
                <div className="grid grid-cols-7 divide-x divide-slate-200">
                  {week.days.map((dayCell, dIndex) => {
                    const isBottomLeft = wIndex === weekRows.length - 1 && dIndex === 0;
                    const isBottomRight = wIndex === weekRows.length - 1 && dIndex === 6;
                    const isHoliday = dayCell.events.some(ev => ev.categoryId === 'closures');
                    const dayEvents = dayCell.events.filter(e => e.categoryId !== 'closures');
                    const visibleLimit = 2;
                    const visibleEvents = dayEvents.slice(0, visibleLimit);
                    const overflowCount = Math.max(0, dayEvents.length - visibleLimit);

                    return (
                      <div
                        key={dayCell.dateString}
                        onClick={() => {
                          if (!dayCell.isCurrentMonth) return;
                          if (dayCell.events.length === 0) {
                            setSelectedEmptyDay(prev => prev === dayCell.dateString ? null : dayCell.dateString);
                            return;
                          }
                          const isSameDay = expandedDay?.dateString === dayCell.dateString;
                          setExpandedDay(isSameDay ? null : dayCell);
                          setExpandedEventId(null);
                          setSelectedEmptyDay(null);
                        }}
                        className={`relative min-h-[64px] sm:min-h-[80px] p-1.5 sm:p-2 flex flex-col justify-between transition-colors cursor-pointer ${
                          isBottomLeft ? 'rounded-bl-xl' : ''
                        } ${isBottomRight ? 'rounded-br-xl' : ''} ${
                          dayCell.isToday
                            ? 'hover:bg-slate-50/50 shadow-[inset_0_4px_0_0_#08328d] z-10'
                            : isHoliday
                            ? 'hover:bg-slate-50/50 shadow-[inset_0_4px_0_0_#dc2626] z-10'
                            : dayCell.isCurrentMonth
                            ? dayCell.isWeekend
                              ? 'bg-slate-50/40 hover:bg-slate-50/70'
                              : 'bg-white hover:bg-slate-50/50'
                            : 'bg-slate-50/70 text-slate-400'
                        } ${dIndex === 5 && !dayCell.isToday && !isHoliday ? 'border-l-2 border-slate-300' : ''} ${!dayCell.isCurrentMonth ? 'bg-white cursor-default' : ''}`}
                      >

                        {dayCell.isCurrentMonth && <>
                        {/* Day Header */}
                        <div className="flex items-center justify-between gap-1 mb-1.5">
                          <div className="flex flex-wrap items-start gap-1.5">
                            {/* Date Number Container */}
                            <div className="flex flex-col items-center">
                              <span
                                className={`inline-flex items-center justify-center font-bold transition-all text-[16px] ${
                                  dayCell.isToday
                                    ? 'w-8 h-8 rounded-full bg-[#08328d] text-white'
                                    : isHoliday
                                    ? 'w-8 h-8 rounded-full bg-red-600 text-white'
                                    : `w-6 h-6 rounded-md ${dayCell.isCurrentMonth ? dayCell.isWeekend ? 'text-slate-600' : 'text-slate-800' : 'text-slate-300'}`
                                }`}
                              >
                                {dayCell.dayNumber}
                              </span>
                            </div>

                            {/* Pill Badge */}
                            {dayCell.isToday && (
                              <span className="mt-0.5 inline-flex items-center text-[9px] font-bold uppercase tracking-wider text-[#08328d] px-1.5 py-0.5 rounded">
                                <span>Today</span>
                              </span>
                            )}
                            {isHoliday && !dayCell.isToday && (
                              <span className="mt-0.5 inline-flex items-center text-[9px] font-bold uppercase tracking-wider text-red-700 px-1.5 py-0.5 rounded">
                                <span>Holiday</span>
                              </span>
                            )}
                          </div>
                        </div>

                        {/* Event Indicators */}
                        <div className="flex-1 flex flex-row flex-wrap content-end items-end justify-start gap-1 overflow-hidden">
                          {visibleEvents.map((ev, idx) => {
                            const cat = EVENT_CATEGORIES[ev.categoryId];
                            return (
                              <div
                                key={`${ev.id}-${idx}`}
                                className={`rounded p-1 border flex items-center justify-center ${cat.bgLight} ${cat.textDark} ${cat.borderColor}`}
                                title={`${ev.title} - ${ev.startTime || 'All day'}`}
                              >
                                <CategoryIcon categoryId={ev.categoryId} className={`w-3.5 h-3.5 shrink-0 ${cat.textDark}`} />
                              </div>
                            );
                          })}

                          {overflowCount > 0 && (
                            <div className="text-[10px] font-bold text-slate-600 bg-slate-100 px-1.5 py-1 rounded flex items-center justify-center whitespace-nowrap">
                              +{overflowCount} More
                            </div>
                          )}
                          {dayCell.events.length === 0 && !isHoliday && selectedEmptyDay === dayCell.dateString && (
                            <span className="text-[10px] text-slate-300 select-none mt-auto">No events</span>
                          )}
                        </div>
                        </>}
                      </div>
                    );
                  })}
                </div>

                {/* Inline Expanded Day List for This Week */}
                {expandedDay && week.days.some(d => d.dateString === expandedDay.dateString) && (() => {
                  const selectedCol = week.days.findIndex(day => day.dateString === expandedDay.dateString);
                  const tailLeft = `calc(${((selectedCol + 0.5) * 100) / 7}% - 8px)`;
                  return (
                    <div className="relative border-t-2 border-slate-400 bg-slate-50 px-3 py-3 animate-fadeIn">
                      <div
                        className="absolute top-0 h-4 w-4 -translate-y-1/2 rotate-45 border-t-2 border-l-2 border-slate-400 bg-slate-50"
                        style={{ left: tailLeft }}
                      />
                      <div className="flex items-center justify-end pb-2">
                        <button onClick={() => { setExpandedDay(null); setExpandedEventId(null); }} className="px-2 py-1 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-900 hover:bg-slate-200/50 transition cursor-pointer">
                          Close
                        </button>
                      </div>
                      
                      <div className="space-y-2">
                        {(
                          [...expandedDay.events].sort((a, b) => {
                              if (!a.startTime && !b.startTime) return 0;
                              if (!a.startTime) return -1;
                              if (!b.startTime) return 1;
                              const toMins = t => {
                                const [time, period] = t.split(' ');
                                let [h, m] = time.split(':').map(Number);
                                if (period === 'PM' && h !== 12) h += 12;
                                if (period === 'AM' && h === 12) h = 0;
                                return h * 60 + m;
                              };
                              return toMins(a.startTime) - toMins(b.startTime);
                            }).map((ev) => {
                            const cat = EVENT_CATEGORIES[ev.categoryId];
                            const isExpanded = expandedEventId === ev.id;
                            return (
                              <div
                                key={ev.id}
                                onClick={() => setExpandedEventId(isExpanded ? null : ev.id)}
                                className="group bg-white border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-slate-300 hover:bg-slate-50/50 transition-colors"
                                role="button"
                                tabIndex="0"
                                aria-expanded={isExpanded}
                                onKeyDown={(event) => {
                                  if (event.key === 'Enter' || event.key === ' ') {
                                    event.preventDefault();
                                    setExpandedEventId(isExpanded ? null : ev.id);
                                  }
                                }}
                              >
                                <div className="flex w-full items-start justify-between gap-2 min-w-0">
                                  <div className="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 min-w-0 flex-1">
                                    {/* Title row */}
                                    <div className="flex items-center gap-2 min-w-0">
                                      <CategoryIcon categoryId={ev.categoryId} className={`w-4 h-4 shrink-0 ${cat.textDark}`} />
                                      <h4 className={`text-[15px] font-bold ${cat.textDark} transition-colors`}>{ev.title}</h4>
                                    </div>
                                    {/* Meta row — wraps on mobile, inline on sm+ */}
                                    <div className="flex items-center flex-wrap gap-x-2 gap-y-1 text-[12px] sm:text-[13px] text-slate-500 pl-6 sm:pl-0">
                                      <span className="hidden sm:inline text-slate-300 shrink-0">&middot;</span>
                                      {ev.startTime ? (
                                        <span className="flex items-center gap-1 shrink-0"><Icon name="Clock" className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-slate-400" />{ev.startTime}</span>
                                      ) : (
                                        <span className="flex items-center gap-1 shrink-0"><Icon name="Clock" className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-slate-400" />All Day</span>
                                      )}
                                      {ev.targetYears && ev.targetYears.length > 0 && (
                                        <>
                                          <span className="text-slate-300 shrink-0">&middot;</span>
                                          <span className="flex items-center gap-1 shrink-0"><Icon name="Users" className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-slate-400" />{ev.targetYears.join(', ')}</span>
                                        </>
                                      )}
                                      {ev.location && (
                                        <>
                                          <span className="text-slate-300 shrink-0">&middot;</span>
                                          <span className="flex items-center gap-1 min-w-0"><Icon name="MapPin" className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-slate-400 shrink-0" /><span className="truncate">{ev.location}</span></span>
                                        </>
                                      )}
                                    </div>
                                  </div>
                                  <Icon name="ChevronDown" className={`w-5 h-5 mr-1 shrink-0 text-slate-400 transition-transform mt-0.5 ${isExpanded ? 'rotate-180' : ''}`} />
                                </div>
                                {isExpanded && (
                                  <div className="pl-4 pt-2 text-sm leading-relaxed text-slate-600">
                                    {ev.description}
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  );
                })()}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // Timeline List View Component
    const TimelineListView = ({ events, onSelectEvent, onResetFilters }) => {
      const sortedEvents = [...events].sort((a, b) => a.startDate.localeCompare(b.startDate));
      const groupedByMonth = [];
      const monthMap = new Map();

      sortedEvents.forEach((ev) => {
        const [year, month] = ev.startDate.split('-');
        const dateObj = new Date(Number(year), Number(month) - 1, 1);
        const monthKey = dateObj.toLocaleDateString('en-IE', { month: 'long', year: 'numeric' });
        if (!monthMap.has(monthKey)) {
          monthMap.set(monthKey, []);
          groupedByMonth.push({ monthLabel: monthKey, items: monthMap.get(monthKey) });
        }
        monthMap.get(monthKey).push(ev);
      });

      if (sortedEvents.length === 0) {
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-12 text-center space-y-3">
            <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400">
              <Icon name="Calendar" className="w-6 h-6" />
            </div>
            <h3 className="text-base font-bold text-slate-800">No events found</h3>
            <p className="text-xs text-slate-500 max-w-sm mx-auto">No calendar events match the active search or filter criteria.</p>
            {onResetFilters && (
              <button onClick={onResetFilters} className="text-xs font-semibold text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition cursor-pointer">
                Reset all filters
              </button>
            )}
          </div>
        );
      }

      return (
        <div className="space-y-6">
          {groupedByMonth.map(({ monthLabel, items }) => (
            <div key={monthLabel} className="bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden">
              <div className="px-5 py-3 bg-slate-50/80 border-b border-slate-200 flex items-center justify-between">
                <h3 className="text-sm font-bold text-slate-900 tracking-tight flex items-center gap-2">
                  <Icon name="CalendarRange" className="w-4 h-4 text-slate-500" />
                  <span>{monthLabel}</span>
                </h3>
                <span className="text-[11px] font-semibold text-slate-500">{items.length} {items.length === 1 ? 'event' : 'events'}</span>
              </div>

              <div className="divide-y divide-slate-100">
                {items.map((ev) => {
                  const cat = EVENT_CATEGORIES[ev.categoryId];
                  const isMultiDay = Boolean(ev.endDate && ev.endDate !== ev.startDate);
                  const isToday = ev.startDate === TODAY_ISO_STRING;
                  const isHoliday = ev.categoryId === 'closures';
                  const startDateObj = new Date(ev.startDate);
                  const dayOfWeek = startDateObj.toLocaleDateString('en-IE', { weekday: 'short' });
                  const dayOfMonth = startDateObj.getDate();

                  return (
                    <div
                      key={ev.id}
                      onClick={() => onSelectEvent(ev)}
                      style={{ borderLeftColor: isToday ? '#08328d' : cat.hex }}
                      className={`p-4 sm:px-5 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition cursor-pointer group ${
                        isToday ? 'bg-blue-50/40 hover:bg-blue-50/70 border-l-4' : 'bg-white hover:bg-slate-50/60 border-l-4'
                      }`}
                    >
                      <div className="flex items-start sm:items-center gap-3.5">
                        <div className={`w-14 sm:w-16 text-center shrink-0 py-1 px-1 rounded-lg ${isToday ? 'bg-blue-100/80 border border-blue-300' : isHoliday ? 'bg-red-100 border border-red-300' : ''}`}>
                          <span className={`text-[10px] font-bold uppercase tracking-wider block ${isToday ? 'text-[#08328d]' : isHoliday ? 'text-red-700' : 'text-slate-400'}`}>
                            {isToday ? 'Today' : isHoliday ? 'Holiday' : dayOfWeek}
                          </span>
                          <span className={`text-lg font-bold leading-tight block ${isToday ? 'text-[#08328d]' : isHoliday ? 'text-red-700' : 'text-slate-900'}`}>
                            {dayOfMonth}
                          </span>
                        </div>

                        <div className="hidden sm:block w-px h-10 bg-slate-200 shrink-0" />

                        <div className="space-y-1">
                          <div className="flex flex-wrap items-center gap-2">
                            {!isHoliday && (
                              <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-semibold border ${cat.bgLight} ${cat.textDark} ${cat.borderColor}`}>
                                <CategoryIcon categoryId={ev.categoryId} className="w-3.5 h-3.5" />
                                <span>{cat.name}</span>
                              </span>
                            )}

                            <span className="text-[11px] text-slate-500 flex items-center gap-1">
                              <Icon name="Users" className="w-3 h-3 text-slate-400" />
                              {ev.targetYears.join(', ')}
                            </span>
                          </div>
                          <h4 className="text-sm font-bold text-slate-900 group-hover:text-slate-950 transition">{ev.title}</h4>
                          <p className="text-xs text-slate-600 line-clamp-1 max-w-2xl">{ev.description}</p>
                        </div>
                      </div>

                      <div className="flex items-center justify-between sm:justify-end gap-4 text-xs text-slate-500 shrink-0">
                        <div className="flex flex-col sm:items-end text-left sm:text-right gap-0.5">
                          <span className="flex items-center gap-1 font-medium text-slate-700">
                            <Icon name="Clock" className="w-3.5 h-3.5 text-slate-400" />
                            {ev.startTime ? `${ev.startTime} – ${ev.endTime || ''}` : 'All Day'}
                          </span>

                        </div>
                        <button className="p-1.5 rounded-lg text-slate-400 group-hover:text-slate-900 transition">
                          <Icon name="ArrowRight" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      );
    };

    // Event Drawer / Modal Component
    const EventModal = ({ event, onClose }) => {
      if (!event) return null;

      const category = EVENT_CATEGORIES[event.categoryId];

      return (
        <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity animate-fadeIn" onClick={onClose}>
          <div className="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden animate-scaleUp" onClick={(e) => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-3.5 sm:px-6 sm:pt-6 sm:pb-4 border-b border-slate-100 flex items-start justify-between gap-4 relative bg-slate-50/50">
              <div className="space-y-2 flex-1 pr-4">
                {category && (
                  <span className={`inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full border ${category.bgLight} ${category.textDark} ${category.borderColor}`}>
                    <CategoryIcon categoryId={event.categoryId} className="w-3 h-3" />
                    <span>{category.name}</span>
                  </span>
                )}
                <h3 className="text-lg sm:text-xl font-bold text-slate-900 leading-tight">
                  {event.title}
                </h3>
              </div>
              <button 
                onClick={onClose} 
                className="p-1.5 -mr-1.5 -mt-1.5 rounded-full text-slate-400 hover:text-slate-900 hover:bg-slate-200/60 transition cursor-pointer shrink-0"
              >
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <div className="px-5 pt-3.5 pb-5 sm:px-6 sm:pt-4 sm:pb-6 space-y-5">
              <div className="space-y-3">
                <div className="flex items-center gap-3 text-sm text-slate-700 font-medium">
                  <div className="flex items-center justify-center p-1.5 bg-slate-50 text-slate-500 border border-slate-200 rounded-md shrink-0">
                    <Icon name="CalendarRange" className="w-4 h-4" />
                  </div>
                  <span>
                    {formatFullDate(event.startDate)}
                    {event.endDate && event.endDate !== event.startDate && (
                      <span className="font-normal text-slate-500"> — {formatFullDate(event.endDate)}</span>
                    )}
                  </span>
                </div>

                <div className="flex items-center gap-3 text-sm text-slate-700 font-medium">
                  <div className="flex items-center justify-center p-1.5 bg-slate-50 text-slate-500 border border-slate-200 rounded-md shrink-0">
                    <Icon name="Clock" className="w-4 h-4" />
                  </div>
                  <span>
                    {event.startTime ? `${event.startTime}${event.endTime ? ` – ${event.endTime}` : ''}` : 'All Day'}
                  </span>
                </div>

              </div>
              
              <div className="text-sm text-slate-600 leading-relaxed pt-2 border-t border-slate-100">
                {event.description}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Subscribe Modal Component
    const SubscribeModal = ({ isOpen, onClose, events }) => {
      const [copiedUrl, setCopiedUrl] = useState(false);
      if (!isOpen) return null;

      const webcalUrl = 'webcal://mountsackville.ie/calendar/feed.ics';
      const httpsUrl = 'https://mountsackville.ie/calendar/feed.ics';

      const handleCopy = (text) => {
        navigator.clipboard.writeText(text);
        setCopiedUrl(true);
        setTimeout(() => setCopiedUrl(false), 2000);
      };

      const handleDownloadFullICS = () => {
        const calendarLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Mount Sackville Secondary School//Academic Calendar 2026-2027//EN',
          'CALSCALE:GREGORIAN',
          'X-WR-CALNAME:Mount Sackville School Calendar',
          'X-WR-TIMEZONE:Europe/Dublin',
        ];

        events.forEach((ev) => {
          const start = ev.startDate.replace(/-/g, '');
          const end = (ev.endDate || ev.startDate).replace(/-/g, '');
          calendarLines.push(
            'BEGIN:VEVENT',
            `UID:${ev.id}@mountsackville.ie`,
            `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
            `DTSTART;VALUE=DATE:${start}`,
            `DTEND;VALUE=DATE:${end}`,
            `SUMMARY:${ev.title}`,
            `DESCRIPTION:${ev.description.replace(/\n/g, '\\n')}`,
            `LOCATION:${ev.location}`,
            'STATUS:CONFIRMED',
            'END:VEVENT'
          );
        });

        calendarLines.push('END:VCALENDAR');
        const blob = new Blob([calendarLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mount_sackville_calendar_2026_2027.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-fadeIn" onClick={onClose}>
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden animate-scaleUp" onClick={(e) => e.stopPropagation()}>
            <div className="bg-[#08328d] p-6 text-white flex items-start justify-between">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <Icon name="Calendar" className="w-5 h-5 text-amber-300" />
                  <h3 className="text-lg font-bold">Subscribe & Sync Calendar</h3>
                </div>
                <p className="text-xs text-blue-100">Mount Sackville Secondary School • Academic Year 2026–2027</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-blue-200 hover:text-white transition">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-6 space-y-5 text-xs text-slate-600">
              <p className="leading-relaxed">
                Subscribe directly to live calendar updates so parent-teacher meetings, school holidays, and examinations appear seamlessly on your phone or laptop.
              </p>

              <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                <div className="flex items-center justify-between font-bold text-slate-800 text-xs">
                  <span className="flex items-center gap-1.5">
                    <Icon name="Smartphone" className="w-4 h-4 text-[#08328d]" /> iPhone / iPad / Mac Calendar
                  </span>
                  <a href={webcalUrl} className="px-2.5 py-1 rounded bg-[#08328d] text-white hover:bg-blue-900 font-semibold transition">
                    1-Click Subscribe
                  </a>
                </div>
                <p className="text-[11px] text-slate-500">Directly integrates into default iOS/macOS Calendar app with automatic push updates.</p>
              </div>

              <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                <div className="flex items-center justify-between font-bold text-slate-800 text-xs">
                  <span className="flex items-center gap-1.5">
                    <Icon name="Globe" className="w-4 h-4 text-[#08328d]" /> Google Calendar / Android
                  </span>
                  <button onClick={() => handleCopy(httpsUrl)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white border border-slate-300 hover:bg-slate-100 font-semibold text-slate-700 transition cursor-pointer">
                    <Icon name={copiedUrl ? "Check" : "Copy"} className="w-3 h-3" />
                    <span>{copiedUrl ? 'Copied Link' : 'Copy Feed URL'}</span>
                  </button>
                </div>
                <p className="text-[11px] text-slate-500">In Google Calendar, click "+" next to Other Calendars &gt; "From URL" and paste link.</p>
              </div>

              <div className="p-3.5 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-3">
                <div>
                  <span className="font-bold text-slate-800 block">Download iCal (.ics) File</span>
                  <span className="text-[11px] text-slate-500">Offline file containing all academic year dates for Outlook or calendar apps.</span>
                </div>
                <button onClick={handleDownloadFullICS} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition cursor-pointer">
                  <Icon name="Download" className="w-3.5 h-3.5" /> Download
                </button>
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
              <button onClick={onClose} className="px-4 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg transition cursor-pointer">
                Done
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Footer Component
    const Footer = () => (
      <footer className="w-full bg-[#08328d] text-white mt-16 print:hidden">
        <div className="h-1.5 w-full bg-[#d91a01]" />
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-center text-center md:text-left">
            <div className="space-y-2 text-xs text-blue-100">
              <h4 className="text-base font-bold text-white tracking-tight">
                Mount Sackville Secondary School
              </h4>
              <p className="text-slate-200">Chapelizod, Dublin 20, D20 X627</p>
              <div className="flex flex-col sm:flex-row items-center justify-center md:justify-start gap-3 pt-1">
                <a href="tel:+353018214061" className="hover:text-white flex items-center gap-1 transition">
                  <Icon name="Phone" className="w-3.5 h-3.5 text-amber-400" />
                  <span>+353 (01) 821 4061</span>
                </a>
                <span className="hidden sm:inline opacity-40">|</span>
                <a href="mailto:info@mountsackville.ie" className="hover:text-white flex items-center gap-1 transition">
                  <Icon name="Mail" className="w-3.5 h-3.5 text-amber-400" />
                  <span>info@mountsackville.ie</span>
                </a>
              </div>
            </div>

            <div className="flex flex-col items-center justify-center">
              <div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 p-2 flex flex-col items-center justify-center text-center shadow-inner">
                <span className="font-black tracking-widest text-amber-300 text-xl leading-none">MS</span>
                <span className="text-[8px] uppercase tracking-widest font-semibold text-blue-200 mt-1">Est. 1864</span>
              </div>
              <p className="text-[11px] text-blue-200 mt-2 italic">
                Fides • Spes • Caritas
              </p>
            </div>

            <div className="flex flex-col items-center md:items-end space-y-3">
              <div className="flex items-center gap-3">
                <a href="https://www.instagram.com/mountsackvillesecondaryschool/" target="_blank" rel="noreferrer" aria-label="Instagram" className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-blue-100 hover:text-white transition">
                  <Icon name="Instagram" className="w-4 h-4" />
                </a>
                <a href="https://twitter.com" target="_blank" rel="noreferrer" aria-label="Twitter" className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-blue-100 hover:text-white transition">
                  <Icon name="Twitter" className="w-4 h-4" />
                </a>
                <a href="#app" className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-blue-100 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold">
                  <Icon name="Smartphone" className="w-4 h-4" />
                  <span>School App</span>
                </a>
              </div>
              <div className="text-[11px] text-blue-200">
                Under the trusteeship of the Sisters of St. Joseph of Cluny
              </div>
            </div>
          </div>

          <div className="mt-8 pt-6 border-t border-blue-800/80 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-blue-200">
            <p>© 2026 Mount Sackville Secondary School. All Rights Reserved.</p>
            <div className="flex items-center gap-4">
              <a href="#privacy" className="hover:text-white transition">Privacy Policy</a>
              <span>•</span>
              <a href="#cookie" className="hover:text-white transition">Cookie Policy</a>
            </div>
          </div>
        </div>
      </footer>
    );

    // --- MAIN APP COMPONENT ---
    function App() {
      const [viewMode, setViewMode] = useState(() => (typeof window !== 'undefined' && window.innerWidth < 768) ? 'list' : 'month');
      const [currentDate, setCurrentDate] = useState(new Date(2026, 8, 17));
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategories, setSelectedCategories] = useState(Object.keys(EVENT_CATEGORIES));
      const [selectedYear, setSelectedYear] = useState('All');
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [isSubscribeOpen, setIsSubscribeOpen] = useState(false);

      const filteredEvents = useMemo(() => {
        return INITIAL_SCHOOL_EVENTS.filter((ev) => {
          if (!selectedCategories.includes(ev.categoryId)) return false;
          if (selectedYear !== 'All') {
            const matchesYear = ev.targetYears.includes(selectedYear) || ev.targetYears.includes('All Years');
            if (!matchesYear) return false;
          }
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase().trim();
            const cat = EVENT_CATEGORIES[ev.categoryId];
            const matchTitle = ev.title.toLowerCase().includes(q);
            const matchDesc = ev.description.toLowerCase().includes(q);
            const matchLoc = ev.location.toLowerCase().includes(q);
            const matchCat = cat?.name.toLowerCase().includes(q) || false;
            const matchYear = ev.targetYears.some((y) => y.toLowerCase().includes(q));
            if (!matchTitle && !matchDesc && !matchLoc && !matchCat && !matchYear) return false;
          }
          return true;
        });
      }, [selectedCategories, selectedYear, searchQuery]);

      const categoryCounts = useMemo(() => {
        const counts = { closures: 0, meetings: 0, induction: 0, exams: 0, sports: 0, guidance: 0, arts: 0 };
        INITIAL_SCHOOL_EVENTS.forEach((ev) => {
          if (counts[ev.categoryId] !== undefined) counts[ev.categoryId]++;
        });
        return counts;
      }, []);

      const handlePrevMonth = () => setCurrentDate((prev) => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      const handleNextMonth = () => setCurrentDate((prev) => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      const handleToday = () => setCurrentDate(new Date(2026, 8, 17));

      const handleApplyCategories = (newCategories) => {
        setSelectedCategories(newCategories);
      };

      const handleSelectAllCategories = () => setSelectedCategories(Object.keys(EVENT_CATEGORIES));

      const handleResetFilters = () => {
        setSearchQuery('');
        setSelectedCategories(Object.keys(EVENT_CATEGORIES));
        setSelectedYear('All');
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#f8fafc] text-slate-900 font-sans antialiased">
          <Header academicYear="2026–2027" onOpenSubscribe={() => setIsSubscribeOpen(true)} />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-3.5">
            <CalendarControls
              currentDate={currentDate}
              onPrevMonth={handlePrevMonth}
              onNextMonth={handleNextMonth}
              onToday={handleToday}
              onDateChange={setCurrentDate}
              viewMode={viewMode}
              onViewModeChange={setViewMode}
              searchQuery={searchQuery}
              onSearchChange={setSearchQuery}
              selectedCategories={selectedCategories}
              onApplyCategories={handleApplyCategories}
              onSelectAllCategories={handleSelectAllCategories}
              selectedYear={selectedYear}
              onSelectYear={setSelectedYear}
              categoryCounts={categoryCounts}
              totalFilteredCount={filteredEvents.length}
            />

            {viewMode === 'month' ? (
              <div className="space-y-2.5">
                <MonthView
                  currentDate={currentDate}
                  events={filteredEvents}
                  onSelectEvent={(ev) => setSelectedEvent(ev)}
                />

              </div>
            ) : (
              <TimelineListView
                events={filteredEvents.filter(ev => {
                  const currentMonthStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
                  const evStartMonthStr = ev.startDate.substring(0, 7);
                  const evEndMonthStr = ev.endDate ? ev.endDate.substring(0, 7) : evStartMonthStr;
                  return evStartMonthStr <= currentMonthStr && evEndMonthStr >= currentMonthStr;
                })}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
                onResetFilters={handleResetFilters}
              />
            )}
          </main>

          <EventModal event={selectedEvent} onClose={() => setSelectedEvent(null)} />
          <SubscribeModal isOpen={isSubscribeOpen} onClose={() => setIsSubscribeOpen(false)} events={INITIAL_SCHOOL_EVENTS} />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
