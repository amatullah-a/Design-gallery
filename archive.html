<style id="gallery-password-gate-style">

#gallery-password-overlay[hidden] { display:none !important; }
#gallery-password-overlay .gate-card { width:min(100%,410px); padding:30px; border:1px solid #e4e6ef; border-radius:20px; background:#fff; box-shadow:0 20px 70px #2023331c; }
#gallery-password-overlay .gate-mark { display:grid; place-items:center; width:46px; height:46px; margin-bottom:18px; border-radius:14px; background:#eeedff; color:#5b52d6; font-size:22px; }

#gallery-password-input { width:100%; padding:12px 13px; border:1px solid #dfe2eb; border-radius:10px; font:inherit; outline:none; }
#gallery-password-input:focus { border-color:#7770ef; box-shadow:0 0 0 3px #7770ef20; }

#gallery-lock-button { position:fixed; right:14px; bottom:14px; z-index:2147483000; padding:8px 11px; border:1px solid #e0e2eb; border-radius:999px; background:#fff; color:#5149c8; font:600 12px/1.2 Inter,ui-sans-serif,system-ui,sans-serif; box-shadow:0 4px 15px #20233314; cursor:pointer; }
</style>
<div id="gallery-password-overlay" role="dialog" aria-modal="true" aria-labelledby="gallery-password-title">
  <form class="gate-card" id="gallery-password-form">
    <div class="gate-mark" aria-hidden="true">⌑</div>
    <h1 id="gallery-password-title">Design Gallery</h1>
    <p>Enter the gallery password to continue.</p>
    <label for="gallery-password-input">Password</label>
    <input id="gallery-password-input" type="password" autocomplete="current-password" required autofocus>
    <button id="gallery-password-submit" type="submit">Unlock gallery</button>
    <p id="gallery-password-error" role="status" aria-live="polite"></p>
  </form>
</div>
<button id="gallery-lock-button" type="button" hidden>Lock gallery</button>
<script id="gallery-password-gate-script">
(function () {
  const expectedHash = "ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f";
  const storageKey = "designGalleryUnlocked_ef797c8118f02dfb";
  const overlay = document.getElementById("gallery-password-overlay");
  const form = document.getElementById("gallery-password-form");
  const input = document.getElementById("gallery-password-input");
  const error = document.getElementById("gallery-password-error");
  const lockButton = document.getElementById("gallery-lock-button");
  function isUnlocked() { try { return sessionStorage.getItem(storageKey) === "yes"; } catch (_) { return false; } }
  function showUnlocked(unlocked) {
    overlay.hidden = unlocked;
    document.documentElement.style.overflow = unlocked ? "" : "hidden";
    lockButton.hidden = !unlocked;
  }
  async function digest(value) {
    const bytes = new TextEncoder().encode(value);
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  showUnlocked(isUnlocked());
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    error.textContent = "";
    const submit = document.getElementById("gallery-password-submit");
    submit.disabled = true;
    try {
      if (await digest(input.value) === expectedHash) {
        try { sessionStorage.setItem(storageKey, "yes"); } catch (_) {}
        showUnlocked(true);
      } else {
        error.textContent = "That password doesn't match. Try again.";
        input.select();
      }
    } catch (_) { error.textContent = "Password check failed in this browser."; }
    finally { submit.disabled = false; }
  });
  lockButton.addEventListener("click", function () {
    try { sessionStorage.removeItem(storageKey); } catch (_) {}
    showUnlocked(false);
    input.value = "";
    input.focus();
  });
})();
</script>
